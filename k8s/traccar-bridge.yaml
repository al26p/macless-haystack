# Traccar bridge: replays Apple FindMy locations from the macless-haystack
# endpoint into Traccar (OsmAnd protocol, port 5055) every 6 hours.
#
# The Secret below maps a Traccar device name to its macless-haystack private
# key (the base64 "Private key" from generate_keys.py / the "_devices.json"
# export). The Apple search id is derived from the private key at runtime, so
# only the private key is stored here.
#
# A tag that rotates through several advertisement keys uses a list value:
#   "Z7NYAJ": ["<leading-b64>", "<b64>", "<b64>", ...]
#
# The Traccar devices must already exist with a matching uniqueId, unless
# database.registerUnknown is enabled on the server.
---
apiVersion: v1
kind: Secret
metadata:
  name: macless-bridge-devices
type: Opaque
stringData:
  devices.json: |
    {
      "airtag1": "REPLACE_WITH_PRIVATE_KEY_B64",
      "Z7NYAJ": ["REPLACE_WITH_LEADING_PRIVATE_KEY_B64", "REPLACE_WITH_PRIVATE_KEY_B64"]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: macless-bridge-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: macless-bridge
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: bridge
              image: ghcr.io/al26p/macless-haystack-bridge:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: MH_ENDPOINT_URL
                  value: http://macless-haystack:6176/find
                - name: TRACCAR_URL
                  value: http://traccar:5055
                - name: DEVICES_FILE
                  value: /etc/macless-bridge/devices.json
                - name: STATE_FILE
                  value: /state/seen.json
                # If the endpoint has basic auth (endpoint_user/endpoint_pass in
                # config.ini), uncomment and point at a Secret with MH_ENDPOINT_USER
                # and MH_ENDPOINT_PASS.
                # - name: MH_ENDPOINT_USER
                #   valueFrom:
                #     secretKeyRef: { name: macless-endpoint-auth, key: MH_ENDPOINT_USER }
                # - name: MH_ENDPOINT_PASS
                #   valueFrom:
                #     secretKeyRef: { name: macless-endpoint-auth, key: MH_ENDPOINT_PASS }
              volumeMounts:
                - name: devices
                  mountPath: /etc/macless-bridge
                  readOnly: true
                - name: state
                  mountPath: /state
          volumes:
            - name: devices
              secret:
                secretName: macless-bridge-devices
            - name: state
              persistentVolumeClaim:
                claimName: macless-bridge-state
